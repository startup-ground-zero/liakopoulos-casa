<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Σελίδα δεν βρέθηκε | Liakopoulos Casa</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@200;300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--color-bg);
        }
        
        .error-content {
            max-width: 500px;
        }
        
        .error-code {
            font-family: var(--font-display);
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 300;
            color: var(--color-accent);
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.3;
        }
        
        .error-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 300;
            color: var(--color-text);
            margin-bottom: 1rem;
        }
        
        .error-desc {
            font-size: 1rem;
            color: var(--color-text-light);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }
        
        .error-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        body { cursor: auto; }
        a { cursor: pointer; }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <a href="index.html" style="display: inline-block; margin-bottom: 3rem;">
                <img src="LIAKOPOULOS_casa_LOGO_for_web.png" alt="Liakopoulos Casa" style="height: 50px; width: auto;">
            </a>
            
            <div class="error-code">404</div>
            <h1 class="error-title">Η σελίδα δεν βρέθηκε</h1>
            <p class="error-desc">
                Η σελίδα που ψάχνετε δεν υπάρχει ή έχει μετακινηθεί. 
                Επιστρέψτε στην αρχική ή εξερευνήστε τις κατηγορίες μας.
            </p>
            
            <div class="error-links">
                <a href="index.html" class="btn btn-primary">
                    <span>Αρχική Σελίδα</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9,22 9,12 15,12 15,22"/>
                    </svg>
                </a>
                <a href="categories.html" class="btn btn-ghost" style="border-color: var(--color-border); color: var(--color-text);">
                    <span>Κατηγορίες</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
